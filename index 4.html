port to move between devices or keep a backup. Version 1 saves remain untouched and use a separate storage key.</p><div class="hero-row">${button('Export career ↓','export','','primary')}${button('Import Version 2 save','import')}${button('New career','reset','','danger')}${button('Game guide','guide','','ghost')}</div></div><div class="section-head"><h2>Activity ledger</h2></div><section class="box"><div class="timeline">${state.events.slice(0,40).map(eventHTML).join('')}</div></section>`;}
function openDialog(type,id){dialog={type,id};renderDialog();}
function field(name,title,val,min=0,max=1e10){return `<div class="field"><label for="term-${name}">${title}</label><input id="term-${name}" class="input" name="${name}" type="number" step="1" inputmode="numeric" min="${min}" max="${max}" value="${val}" required></div>`;}
function renderDialog(){const root=$('#modalroot');if(!dialog){root.innerHTML='';return;}let html='';const {type,id}=dialog;
if(type==='profile'){const p=E.player(state,id),assignment=state.assignments.find(a=>a.playerId===id);html=`<div class="eyebrow">PLAYER DOSSIER</div><h2>${esc(p.name)}</h2><p>${esc(p.bio)}</p><div class="subgrid profile-stats">${label('Overall / potential',`${p.ovr} / ${potential(p)}`)}${label('Personality',p.personality)}${label('Market value',money(E.value(p)))}${label('Weekly wage',money(p.wage))}${label('Club contract',p.contract?`${p.contract} weeks remaining`:'Free agent')}${label('Fitness',p.injury?`Out for ${p.injury} weeks`:'Match fit')}${label('Trust / morale',`${p.trust} / ${p.morale}`)}${label('Season goals',p.goals)}</div><p>${p.personality==='Ambitious'?'Wants at least a rotation role.':p.personality==='Loyal'?'Wants a contract of at least three years.':'Flexible about role and contract length.'} No player accepts a wage cut.</p><div class="hero-row">${p.report?tag('Full report available'):assignment?tag(`Report due in ${assignment.due-state.tick}w`):button('Scout report · €500','report',id,'primary')}${!p.client?button('Represent player','sign',id,'primary'):button('Check in · €300','care',id)}${p.client&&p.injury?button('Medical support · €1,200 / −2w','medical',id):''}${p.client?button('End representation','release',id,'ghost'):''}</div>`;}
if(type==='sign'){const p=E.player(state,id);html=`<div class="eyebrow">REPRESENTATION AGREEMENT</div><h2>Back ${esc(p.name)}.</h2><p>Pay a ${money(p.advance)} advance to represent this player. You earn 3% of weekly wages and commissions on completed transfers.</p><div class="notice">Cash after signing: ${money(state.cash-p.advance)}<br>Roster: ${E.clients(state).length} / ${E.capacity(state)}<br>${E.windowOpen(state)?'Eligible players can receive an immediate club approach.':'Club approaches resume when the window opens.'}</div><div class="modal-action">${button('Confirm representation','confirm-sign',id,'primary')}${button('Go back','close')}</div>`;}
if(type==='negotiate'||type==='review'){const o=state.offers.find(o=>o.id===id);if(!o||o.status!=='open'){dialog=null;root.innerHTML='';return;}const p=E.player(state,o.playerId),c=E.club(state,o.clubId);html=`<div class="eyebrow">${type==='review'?'FINAL SIGNATURE':'NEGOTIATION ROOM'} · ROUND ${o.rounds}/${state.staff.lawyer?4:3}</div><h2>${esc(c.name)}</h2><p>${esc(p.name)} · Club relationship ${c.relation}/100</p>`;
if(type==='review'){html+=`<div class="notice">Transfer fee: <b>${money(o.fee)}</b><br>Player wages: <b>${money(o.wage)} / week</b><br>Player signing bonus: <b>${money(o.bonus)}</b><br>${o.years} years · ${o.role}<br>Agency commission: <b class="lime">${money(Math.round(o.fee*.05+o.bonus*.03))}</b></div><p>The fee is paid between clubs. The bonus goes to your player. Once signed, this move cannot be undone.</p><div class="modal-action">${button('Sign & complete transfer','confirm-deal',id,'primary')}${button('Edit terms','negotiate',id)}</div>`;
}else{html+=`<div class="notice">Player minimum: ${money(p.wage)} / week. ${p.personality==='Ambitious'?'Requires Rotation or Starter.':p.personality==='Loyal'?'Requires 3–5 years.':'Flexible on role and length.'}<br>Selling club minimum: ${p.contract?money(Math.round(E.value(p)*.7)):'€0 (free agent)'}<br>Club guidance: fee near ${money(o.fee)}, wages near ${money(o.wage)}. Long contracts consume more of the wage budget.</div>${o.history.length?`<p class="lime">${esc(o.history[o.history.length-1])}</p>`:''}<form id="counter-form" data-id="${id}"><div class="neg-fields">${field('fee','Transfer fee (€)',o.fee)}${field('wage','Weekly wage (€)',o.wage,1,1e7)}${field('bonus','Signing bonus (€)',o.bonus,0,1e9)}<div class="field"><label for="term-years">Contract length</label><select id="term-years" name="years">${[1,2,3,4,5].map(y=>`<option value="${y}" ${o.years===y?'selected':''}>${y} years</option>`).join('')}</select></div><div class="field"><label for="term-role">Squad role</label><select id="term-role" name="role">${['Starter','Rotation','Prospect'].map(r=>`<option ${o.role===r?'selected':''}>${r}</option>`).join('')}</select></div></div><p class="note">Enter any whole-euro amount. Each submitted counter uses one round. Excessive demands can end talks.</p><div class="modal-action"><button class="btn primary" type="submit">Submit counteroffer →</button>${button('Review current offer','review',id,'ghost')}</div></form>`;}}
if(type==='week'){const exp=E.offers(state).filter(o=>o.expires===state.tick||[8,30].includes(E.week(state))).length;html=`<div class="eyebrow">TIME MOVES FOR EVERYONE</div><h2>Advance one week?</h2><p>Receive salary commissions, pay overhead, simulate the league, and update injuries, development and transfer interest.</p><div class="notice">Projected cash: ${money(state.cash+E.income(state)-E.overhead(state))}<br>${exp?`${exp} live offer(s) will expire.<br>`:''}${E.week(state)===52?'A new season begins. Players age and club budgets refresh.':'Your career autosaves after the update.'}</div>${state.decision?'<p class="negative">Resolve the client decision on Overview or Clients first.</p>':''}<div class="modal-action">${button('Continue →','confirm-week','','primary')}${button('Stay this week','close')}</div>`;}
if(type==='release')html=`<h2>End representation?</h2><p>${esc(E.player(state,id).name)} will leave your roster. Open approaches will close, salary commissions will stop, and reputation will fall by one. The signing advance is not refunded.</p><div class="modal-action">${button('End agreement','confirm-release',id,'danger')}${button('Keep client','close')}</div>`;
if(type==='decline')html=`<h2>Walk away?</h2><p>The offer will close. Your relationship with this club will fall by one point.</p><div class="modal-action">${button('Decline offer','confirm-decline',id,'danger')}${button('Keep talking','close')}</div>`;
if(type==='staff'){const v=E.staffInfo[id];html=`<h2>${state.staff[id]?'Dismiss':'Hire'} ${v.name}?</h2><p>${v.desc}</p><p>${state.staff[id]?'Their benefits and weekly wages end immediately.':`Recruitment: ${money(v.hire)}. Weekly cost: ${money(v.wage)}.`}</p><div class="modal-action">${button('Confirm','confirm-staff',id,'primary')}${button('Cancel','close')}</div>`;}
if(type==='loan')html=`<h2>A financial lifeline.</h2><p>Borrow €25,000 once per career. Debt grows by 0.2% each week until fully repaid. Reputation falls by 5.</p><div class="modal-action">${button('Accept loan','confirm-loan','','primary')}${button('Cancel','close')}</div>`;
if(type==='reset')html=`<h2>Start again?</h2><p>This replaces your current career. Export a backup before proceeding.</p><div class="modal-action">${button('Export first','export','','primary')}${button('Start new career','confirm-reset','','danger')}${button('Cancel','close')}</div>`;
if(type==='import-review')html=`<h2>Restore this career?</h2><p><b>${esc(importCandidate.agency)}</b><br>Season ${E.season(importCandidate)}, week ${E.week(importCandidate)} · ${money(importCandidate.cash)} · ${E.clients(importCandidate).length} clients.</p><p>This replaces your current career. Export it first if you want to keep both.</p><div class="modal-action">${state?button('Export current','export'):''}${button('Restore career','confirm-import','','primary')}${button('Cancel','close')}</div>`;
if(type==='guide')html=`<div class="eyebrow">THE AGENT'S HANDBOOK</div><h2>Build careers. Build trust.</h2><ol class="guide"><li><b>Find your first client.</b> Scouting lists unrepresented players. Reports cost €500 and reveal true potential. Signing costs a one-time advance.</li><li><b>Read every offer.</b> Summer runs weeks 1–8; winter runs 27–30. Offers last two weeks. Clubs must afford the fee and contract package. Ambitious players need minutes; loyal players need security.</li><li><b>Negotiate, then sign.</b> Counter any whole-euro amount. Clubs can counter back or walk away after three failed rounds (four with a lawyer). Agreed terms still need a final signature.</li><li><b>Keep the office running.</b> Earn 5% of transfer fees, 3% of signing bonuses, and 3% of weekly wages. Office costs are €500/week plus staff. A loan can bridge one cash crisis.</li><li><b>Care for your clients.</b> Weekly check-ins restore trust. Medical support shortens injuries. Trust below 25 causes departures. Staff improve reports, negotiations, development, and capacity.</li><li><b>Plan beyond this window.</b> Transfers have a 26-week cooldown. Young players improve with playing time. Contracts expire, players age and retire, new talent arrives, and league seasons continue.</li><li><b>Protect your progress.</b> Every action saves locally. Export from Agency for a portable backup. Version 1 saves are kept separate and are not compatible with the expanded world.</li></ol>`;
root.innerHTML=`<div class="modal-back"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(type)}"><button class="modal-close" data-action="close" aria-label="Close dialogue">✕</button>${html}</section></div>`;root.querySelector('input,button')?.focus();}
function exportSave(){if(!state)return;const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download='the-agency-2-career.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Career exported. Keep your backup somewhere safe.');}
document.addEventListener('click',e=>{const t=e.target.closest('[data-action],[data-tab]');if(!t){if(e.target.classList.contains('modal-back')){dialog=null;renderDialog();}return;}if(t.dataset.tab){tab=t.dataset.tab;dialog=null;render();window.scrollTo(0,0);return;}const a=t.dataset.action,id=t.dataset.id;
if(['profile','sign','negotiate','review','decline','week','staff','loan','reset','guide','release'].includes(a)){openDialog(a,id);return;}
if(a==='close'){dialog=null;renderDialog();return;}if(a==='filter'){filter=id;render();return;}if(a==='export'){exportSave();return;}if(a==='import'){$('#importfile').click();return;}
if(a==='confirm-reset'){try{localStorage.removeItem(KEY);localStorage.removeItem(BACKUP);}catch{toast('Browser storage is unavailable.');}state=null;dialog=null;loadWarning='';render();renderDialog();return;}
if(a==='confirm-import'){state=importCandidate;importCandidate=null;dialog=null;tab='hq';loadWarning='';save();render();toast('Career restored.');return;}
act(()=>{let msg='';switch(a){case 'confirm-release':E.release(state,id);dialog=null;break;case 'confirm-sign':E.sign(state,id);dialog=null;tab='clients';msg='New client signed.';break;case 'confirm-deal':msg='Transfer complete. Commission: '+money(E.close(state,id));dialog=null;break;case 'confirm-decline':E.reject(state,id);dialog=null;break;case 'confirm-week':E.advance(state);dialog=null;msg=`Season ${E.season(state)}, week ${E.week(state)}. Your world has moved forward.`;break;case 'report':E.report(state,id);msg='Report commissioned.';break;case 'discover':E.discover(state);msg='New talent added to your network.';break;case 'confirm-staff':E.hire(state,id);dialog=null;break;case 'care':E.care(state,id,'meeting');msg='Client trust improved.';break;case 'medical':E.care(state,id,'medical');msg='Specialist treatment complete.';break;case 'decision':E.decision(state,id);break;case 'confirm-loan':E.loan(state);dialog=null;break;case 'repay':E.repay(state);break;default:throw Error('Unknown action.');}if(msg)toast(msg);});});
document.addEventListener('submit',e=>{if(e.target.id==='start-form'){e.preventDefault();const name=e.target.elements.agency.value.trim();if(!name)return;state=E.fresh(name);tab='hq';save();render();}if(e.target.id==='counter-form'){e.preventDefault();const f=e.target;act(()=>{const msg=E.counter(state,f.dataset.id,{fee:Number(f.elements.fee.value),wage:Number(f.elements.wage.value),bonus:Number(f.elements.bonus.value),years:Number(f.elements.years.value),role:f.elements.role.value});toast(msg);});}});
document.addEventListener('change',async e=>{if(e.target.id==='sort'){sort=e.target.value;render();}if(e.target.id==='importfile'){const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>5e6)throw Error('Save file is too large (maximum 5 MB).');const parsed=JSON.parse(await file.text());if(!E.validate(parsed))throw Error(parsed?.version===1?'Version 1 saves are preserved separately but cannot be imported into Version 2.':'Invalid or damaged Version 2 save. Your current career is unchanged.');importCandidate=parsed;openDialog('import-review');}catch(err){toast(err.message);}}});
document.addEventListener('keydown',e=>{if(!dialog)return;if(e.key==='Escape'){dialog=null;renderDialog();}if(e.key==='Tab'){const items=[...$('#modalroot').querySelectorAll('button,input,select')].filter(x=>!x.disabled);if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
state=load();render();
})();
</script></body></html>
